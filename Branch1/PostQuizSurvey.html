{{ block title }}
    Post Quiz Survey
{{ endblock }}
{{ block content }}
        <form>
            <label for="q1"><b>Question 1: erformances of all participants on a scale of 1 (scoring the highest) to 500 (scoring the lowest), what place do you think you would be?</b></label>
            <br></br>
            <input type="number" id="q1" name="q1" min="1" max="500" title="Enter a number between 1 and 500"><label> / 500</label>
            <br></br>
            <label for="q2"><b>Question 2: Out of the 10 multiple choice questions, how many do you think you answered correctly?</b></label>
            <br></br>
            <input type="number" id="q2" name="q2" min="0" max="10" title="Enter a number between  and 10"><label>/10</label>
            <br></br>
            <label for="q3"><b>Question 3: Between what range of questions do you think you answered correctly?</b></label>
            <br></br>
            <input type="number" id="q3a_start" name="q3a_start" min="0" max="10" title="Enter a number between 0 and 10"><label> - </label>
            <input type="number" id="q3a_end" name="q3a_end" min="0" max="10" title="Enter a number between 0 and 10">
            <br></br>
            <script>
                const startInput = document.getElementById('q3a_start');
                const endInput = document.getElementById('q3a_end');

                startInput.addEventListener('input', function() {
                    if (parseInt(startInput.value) >= parseInt(endInput.value)) {
                        startInput.setCustomValidity('Start value must be less than end value');
                    } else {
                        startInput.setCustomValidity('');
                    }
                });

                endInput.addEventListener('input', function() {
                    if (parseInt(endInput.value) <= parseInt(startInput.value)) {
                        endInput.setCustomValidity('End value must be greater than start value');
                    } else {
                        endInput.setCustomValidity('');
                    }
                });
            </script>
        </form>
        {{ next_button }}
{{ endblock }}
