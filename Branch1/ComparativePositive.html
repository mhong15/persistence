<br></br>
<button id="reveal-button">{{ 'Reveal the ball' }}</button>

<img id="ball-image" style="display: none; margin-top: 20px;" src="" alt="Ball Image">
<script>
        document.getElementById('reveal-button').onclick = function(event) {
            event.preventDefault();
    
            document.getElementById('reveal-button').innerText = "Ball Revealed";
    
            var color = '{{ player.ball_color }}';

            var imagePath = color === 'red' ? 'https://drive.google.com/thumbnail?id=10gdBZHBzrYodcg4rNJEeQucw57fupodG' : 'https://drive.google.com/thumbnail?id=1AMqy_PpKLv7-d6vZmE1Io2R8YfeMJBK1';
            document.getElementById('ball-image').src = imagePath;

            document.getElementById('ball-image').style.display = 'block';
        };
    </script>

    {{ next_button }}

{{ endblock }}
